name: Master Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [actualizar-todo]

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar parquet ambulatorio
        id: cache-ambulatorio
        uses: actions/cache@v4
        with:
          path: data/raw/ambulatorio.parquet
          key: ambulatorio-parquet-${{ github.run_id }}
          restore-keys: ambulatorio-parquet-

      - name: Restaurar parquet farmvac
        id: cache-farmvac
        uses: actions/cache@v4
        with:
          path: data/raw/farmvac.parquet
          key: farmvac-parquet-${{ github.run_id }}
          restore-keys: farmvac-parquet-

      - name: Restaurar parquet provision
        id: cache-provision
        uses: actions/cache@v4
        with:
          path: |
            data/raw/provision.parquet
            data/raw/provision_diario.parquet
          key: provision-parquet-${{ github.run_id }}
          restore-keys: provision-parquet-

      - name: Restaurar parquet discapacidad
        id: cache-discapacidad
        uses: actions/cache@v4
        with:
          path: data/raw/discapacidad.parquet
          key: discapacidad-parquet-${{ github.run_id }}
          restore-keys: discapacidad-parquet-

      - name: Restaurar parquet protesis
        id: cache-protesis
        uses: actions/cache@v4
        with:
          path: data/raw/protesis.parquet
          key: protesis-parquet-${{ github.run_id }}
          restore-keys: protesis-parquet-

      - name: Escribir credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: E→S Ambulatorio
        if: steps.cache-ambulatorio.outputs.cache-hit != 'true'
        env:
          MSTR_USER:     ${{ secrets.MSTR_USER }}
          MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from src.extract.ambulatorio import extract_u6m;
          from src.stage.ambulatorio import stage_u6m;
          stage_u6m(extract_u6m())"

      - name: T→L Ambulatorio
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: PYTHONPATH=. python src/pipelines/ambulatorio.py

      - name: E→S Farmvac
        if: steps.cache-farmvac.outputs.cache-hit != 'true'
        env:
          MSTR_USER:     ${{ secrets.MSTR_USER }}
          MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from src.extract.farmvac import extract_farm_u6m, extract_vac_u6m;
          from src.stage.farmvac import stage_u6m;
          stage_u6m(extract_farm_u6m(), extract_vac_u6m())"

      - name: T→L Farmvac
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: PYTHONPATH=. python src/pipelines/farmvac.py

      - name: E→S Provision
        if: steps.cache-provision.outputs.cache-hit != 'true'
        env:
          MSTR_USER:     ${{ secrets.MSTR_USER }}
          MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from src.extract.provision import extract_provision, extract_provision_diario;
          from src.stage.provision import stage, stage_diario;
          stage(extract_provision());
          stage_diario(extract_provision_diario())"

      - name: T→L Provision
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: PYTHONPATH=. python src/pipelines/provision.py

      - name: E→S Discapacidad
        if: steps.cache-discapacidad.outputs.cache-hit != 'true'
        env:
          MSTR_USER:     ${{ secrets.MSTR_USER }}
          MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from src.extract.discapacidad import extract_discapacidad;
          from src.stage.discapacidad import stage;
          stage(extract_discapacidad())"

      - name: T→L Discapacidad
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: PYTHONPATH=. python src/pipelines/discapacidad.py

      - name: E→S Protesis
        if: steps.cache-protesis.outputs.cache-hit != 'true'
        env:
          MSTR_USER:     ${{ secrets.MSTR_USER }}
          MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from src.extract.protesis import extract_protesis;
          from src.stage.protesis import stage;
          stage(extract_protesis())"

      - name: T→L Protesis
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: PYTHONPATH=. python src/pipelines/protesis.py

      - name: Subir SQLite como artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sda-sqlite-${{ github.run_id }}
          path: data/processed/sda.sqlite
          retention-days: 30

      - name: Notificar error en Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PYTHONPATH=. python -c "
          from src.utils.discord import notify_error;
          notify_error('Error en GitHub Actions - Master Pipeline', Exception('El workflow falló. Revisa los logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
