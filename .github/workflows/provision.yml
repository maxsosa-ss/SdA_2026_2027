name: Provision Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [actualizar-provision]

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular fecha (cache key)
        id: vars
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurar parquets cacheados
        id: cache-parquet
        uses: actions/cache@v4
        with:
          path: |
            data/raw/provision.parquet
            data/raw/provision_diario.parquet
            data/raw/provision_nc.parquet
          key: provision-parquet-${{ steps.vars.outputs.today }}
          restore-keys: provision-parquet-

      - name: Restaurar SQLite acumulado
        uses: actions/cache@v4
        with:
          path: data/processed/sda.sqlite
          key: sqlite-${{ steps.vars.outputs.today }}-${{ github.run_id }}
          restore-keys: sqlite-

      - name: Escribir credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Sync provision (E -> S)
        if: steps.cache-parquet.outputs.cache-hit != 'true'
        env:
          MSTR_USER:     ${{ secrets.MSTR_USER }}
          MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from src.extract.provision import extract_provision, extract_provision_diario, extract_nc;
          from src.stage.provision import stage, stage_diario, stage_nc;
          stage(extract_provision());
          stage_diario(extract_provision_diario());
          stage_nc(extract_nc())"

      - name: Ejecutar pipeline (T -> L)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: PYTHONPATH=. python src/pipelines/provision.py

      - name: Notificar error en Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PYTHONPATH=. python -c "
          from src.utils.discord import notify_error;
          notify_error('Error en GitHub Actions - Provisión', Exception('El workflow falló. Revisa los logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
