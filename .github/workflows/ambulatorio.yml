name: Ambulatorio Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [actualizar-ambulatorio]

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular fecha (cache key)
        id: vars
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurar parquet cacheado
        id: cache-parquet
        uses: actions/cache@v4
        with:
          path: |
            data/raw/ambulatorio.parquet
            data/raw/ambulatorio_resto.parquet
          key: ambulatorio-parquet-${{ steps.vars.outputs.today }}
          restore-keys: ambulatorio-parquet-

      - name: Restaurar SQLite acumulado
        uses: actions/cache@v4
        with:
          path: data/processed/sda.sqlite
          key: sqlite-${{ steps.vars.outputs.today }}-${{ github.run_id }}
          restore-keys: sqlite-

      - name: Escribir credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Sync ultimos 6 meses (E -> S)
        if: steps.cache-parquet.outputs.cache-hit != 'true'
        env:
          MSTR_USER:     ${{ secrets.MSTR_USER }}
          MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from src.extract.ambulatorio import extract_u6m, extract_resto;
          from src.stage.ambulatorio import stage_u6m, stage_resto;
          stage_u6m(extract_u6m());
          stage_resto(extract_resto())"

      - name: Ejecutar pipeline (T -> L)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: PYTHONPATH=. python src/pipelines/ambulatorio.py

      - name: Notificar error en Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PYTHONPATH=. python -c "
          from src.utils.discord import notify_error;
          notify_error('Error en GitHub Actions - Ambulatorio', Exception('El workflow fallo. Revisa los logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
